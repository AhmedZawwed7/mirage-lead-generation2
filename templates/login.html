<!doctype html><html lang='ar' dir='rtl'><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Mirage Login</title><style>body{margin:0;background:#0b1020;color:#eef2ff;font:16px Arial;display:grid;place-items:center;min-height:100vh}.card{width:min(380px,88vw);background:#151d32;padding:32px;border:1px solid #293653;border-radius:20px}input,button{box-sizing:border-box;width:100%;padding:14px;margin:8px 0;border-radius:10px;border:1px solid #34435f;background:#0c1426;color:white}button{background:#526fe2;border:0;font-weight:bold}</style><div class='card'><h1>MIRAGE <span style='color:#8da5ff'>LEADS HUNTER</span></h1><p>تسجيل الدخول إلى لوحة العملاء</p>{% for m in get_flashed_messages() %}<p>{{m}}</p>{% endfor %}<form method='post'><input name='username' placeholder='اسم المستخدم' required><input name='password' type='password' placeholder='كلمة المرور' required><button>دخول</button></form></div></html>
